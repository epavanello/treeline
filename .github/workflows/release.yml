# Every push to main whose packages/extension/package.json version has no tag yet is released:
# tag v<version> + GitHub release with the .vsix and that version's CHANGELOG section, then the stores.
# Pushes that don't change the version publish nothing (and warn if the extension changed anyway).
# Run by hand (Run workflow) to publish the current version's released .vsix to the stores missing it.
#
# Open VSX: trusted publishing (OIDC, no secret), registered for this workflow at
# open-vsx.org/user-settings/trusted-publishers; enabled by the repository variable
# OPENVSX_TRUSTED_PUBLISHING=true. An OVSX_PAT secret, if present, is used instead.
# VS Code Marketplace: through Microsoft Entra ID when the repository variables AZURE_CLIENT_ID and
# AZURE_TENANT_ID name the Entra app "treeline-release", federated with this repo's main branch and a
# Contributor of the publisher (check it with the Marketplace access workflow; no secret, nothing expires); or
# with a VSCE_PAT secret (global Azure DevOps PATs are retired on 2026-12-01); otherwise the run summary
# says to upload the .vsix at marketplace.visualstudio.com/manage.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled halfway through publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, to compare with the last release
      - id: version
        name: Is this version already released?
        run: |
          v=$(node -p "require('./packages/extension/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Run by hand: publishing v$v to the stores that don't have it yet." >> "$GITHUB_STEP_SUMMARY"
          elif git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            if ! git diff --quiet "v$v" HEAD -- packages/extension packages/webview packages/shared; then
              echo "::warning::The extension changed since v$v but its version didn't: bump packages/extension/package.json and add a CHANGELOG section to release it."
            fi
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # OIDC tokens: Open VSX trusted publishing, Azure sign-in for the Marketplace
    env:
      TAG: v${{ needs.check.outputs.version }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: This version has a CHANGELOG section
        run: |
          awk -v v="${TAG#v}" '/^## /{p=($2==v); next} p' packages/extension/CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error::Add a '## ${TAG#v}' section to packages/extension/CHANGELOG.md"; exit 1; }
      - run: pnpm test
      - run: pnpm package
      - name: GitHub release (creates the tag)
        # Already released (a run by hand): publish exactly the .vsix attached to that release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" -p treeline.vsix -D packages/extension --clobber
          else
            gh release create "$TAG" packages/extension/treeline.vsix --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi
      - name: Sign in to Azure as the Marketplace publishing identity
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Marketplace identity
        if: vars.AZURE_CLIENT_ID != ''
        # The ID to add as a Contributor of the publisher (once) at marketplace.visualstudio.com/manage
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "**Marketplace publishing identity:** \`$id\` (a Contributor of the epavanello publisher)" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the VS Code Marketplace
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            pnpm --filter treeline exec vsce publish --no-dependencies --skip-duplicate --packagePath treeline.vsix --azure-credential
          elif [ -n "$VSCE_PAT" ]; then
            pnpm --filter treeline exec vsce publish --no-dependencies --skip-duplicate --packagePath treeline.vsix
          else
            echo "::notice::VS Code Marketplace: upload the $TAG .vsix from the GitHub release at https://marketplace.visualstudio.com/manage/publishers/epavanello (… → Update)."
            echo "**VS Code Marketplace:** upload \`treeline.vsix\` from the [$TAG release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) at https://marketplace.visualstudio.com/manage/publishers/epavanello (… → Update)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to Open VSX
        run: |
          if [ -n "$OVSX_PAT" ]; then
            pnpm --filter treeline exec ovsx publish treeline.vsix --skip-duplicate
          elif [ "${{ vars.OPENVSX_TRUSTED_PUBLISHING }}" = "true" ]; then
            pnpm --filter treeline exec ovsx publish treeline.vsix --skip-duplicate --trusted-publishing
          else
            echo "::notice::Open VSX skipped: trusted publishing isn't enabled yet (repository variable OPENVSX_TRUSTED_PUBLISHING)."
            echo "**Open VSX:** skipped until trusted publishing is enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
